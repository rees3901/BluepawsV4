[platformio]
default_envs = personal_collar

[env:personal_collar]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
lib_extra_dirs = ../../shared/lib
extra_scripts = pre:build_config.py
board_build.flash_size = 8MB
board_build.partitions = huge_app.csv
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@7.1.2
    mikalhart/TinyGPSPlus@1.1.0

; Compiles the actual firmware but halts before accessing radio/GNSS hardware.
[env:personal_compile_check]
extends = env:personal_collar
build_flags = ${env:personal_collar.build_flags} -DPERSONAL_COMPILE_CHECK=1
