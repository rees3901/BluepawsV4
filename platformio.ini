; BluepawsV4 — Unified Cat Tracker Firmware
; Collar (nRF52840) + Home Hub (ESP32-S3)
; Shared protocol library in shared/lib/

[platformio]
default_envs = collar, hub
src_dir = .

; ─────────────────────────────────────────────
; Collar: Seeed XIAO nRF52840 + SX1262 + GNSS + NB-IoT
; ─────────────────────────────────────────────
[env:collar]
platform = nordicnrf52
board = xiao_ble_sense
framework = arduino
lib_extra_dirs = shared/lib
build_src_filter =
    +<collar/src/>
    -<hub/>
    -<web/>
    -<tools/>
    -<supabase/>
    -<docs/>
build_flags =
    -DUSE_FREERTOS=1
    -Icollar/include
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.2

; ─────────────────────────────────────────────
; Home Hub prototype: Heltec Wireless Tracker V2 ESP32-S3 + SX1262 + WiFi + BLE
; ─────────────────────────────────────────────
[env:hub]
platform = espressif32
board = heltec_wireless_tracker_v2
framework = arduino
lib_extra_dirs = shared/lib
build_src_filter =
    +<hub/src/>
    -<collar/>
    -<web/>
    -<tools/>
    -<supabase/>
    -<docs/>
board_build.filesystem = littlefs
board_build.flash_mode = dio
board_build.flash_size = 8MB
build_flags =
    -DUSE_FREERTOS=1
    -Ihub/include
    -D RADIOLIB_EXCLUDE_CC1101
    -D RADIOLIB_EXCLUDE_NRF24
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_SI443X
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_SX128X
    -D RADIOLIB_EXCLUDE_LR11X0
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_BELL
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_LORAWAN
    -D RADIOLIB_EXCLUDE_FSK4
    -D RADIOLIB_EXCLUDE_PAGER
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.2
