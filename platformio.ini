; BluepawsV4 — Unified Cat Tracker Firmware
; Current hardware test-bed: WisMesh Board ONE / RAK4631 (nRF52840 + SX1262)
; Future collar proof-of-concept pairing: Walter ESP32 + GM02SP LTE modem
; Shared protocol library in shared/lib/

[platformio]
default_envs = rak4631_collar_testbed
boards_dir = rakwireless/boards

; ─────────────────────────────────────────────
; Hardware confidence test: RAK4631 / WisMesh Board ONE
; Blinks the WisBlock green/blue LEDs three times, pauses, repeats.
; Upload with:
;   pio run -e rak4631_blink -t upload --upload-port COM23
; ─────────────────────────────────────────────
[env:rak4631_blink]
platform = nordicnrf52
board = rak4630
framework = arduino
build_src_filter =
    +<../hardware_tests/rak4631_blink/main.cpp>
    +<../rakwireless/variants/rak4630>
build_flags =
    -I rakwireless/variants/rak4630
monitor_speed = 115200

; ─────────────────────────────────────────────
; Collar proof-of-concept: WisMesh Board ONE / RAK4631
; Builds TLV v1.1 packets and transmits raw binary TLV over private SX1262 LoRa.
; This is the V4 test-bed firmware; V3 receiver/sniffer values are reference only.
; Upload with:
;   pio run -e rak4631_collar_testbed -t upload --upload-port COM23
; ─────────────────────────────────────────────
[env:rak4631_collar_testbed]
platform = nordicnrf52
board = rak4630
framework = arduino
lib_extra_dirs = shared/lib
build_src_filter =
    +<../firmware/collar_rak4631_testbed/main.cpp>
    +<../rakwireless/variants/rak4630>
build_flags =
    -I rakwireless/variants/rak4630
    -I shared/lib/BluepawsProtocol
    -D MY_DEVICE_ID=1001
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.2

; ─────────────────────────────────────────────
; V4 LoRa sniffer: Heltec Vision Master T190 / ESP32-S3 + SX1262
; Receive-only monitor for raw Bluepaws TLV v1.1 packets over private LoRa.
; Upload with:
;   pio run -e heltec_t190_v4_sniffer -t upload --upload-port COM11
; ─────────────────────────────────────────────
[env:heltec_t190_v4_sniffer]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_extra_dirs = shared/lib
build_src_filter =
    +<../firmware/heltec_t190_v4_sniffer/main.cpp>
build_flags =
    -I shared/lib/BluepawsProtocol
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_build.filesystem = littlefs
lib_deps =
    jgromes/RadioLib@^7.1.2
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0

; ─────────────────────────────────────────────
; V4 Home Hub substitute: Heltec Wireless Tracker V2 / ESP32-S3 + SX1262
; Receives raw collar TLV over private LoRa and relays it to Supabase as
; base64-wrapped HTTPS JSON. Credentials are configured at runtime over serial
; and stored in ESP32 NVS; do not commit bearer tokens.
; Upload with:
;   pio run -e heltec_tracker_v2_home_hub -t upload --upload-port COM7
; ─────────────────────────────────────────────
[env:heltec_tracker_v2_home_hub]
platform = espressif32
board = heltec_wireless_tracker_v2
framework = arduino
lib_extra_dirs = shared/lib
build_src_filter =
    +<../firmware/heltec_tracker_v2_home_hub/main.cpp>
build_flags =
    -I shared/lib/BluepawsProtocol
board_build.flash_mode = dio
board_build.flash_size = 8MB
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.2
